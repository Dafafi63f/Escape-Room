name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pre-commits:
    name: Pre-Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-Commits
        uses: pre-commit/action@v3.0.1

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests Juego
        run: python -m unittest discover -s Tests/Juego -v

      - name: Tests Scripts
        run: python -m unittest discover -s Tests/Scripts -v

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Suite completa
        run: python -m unittest discover -s Tests -v

      - name: Validar banco cerrado
        run: python Files/Scripts/mantenimiento.py validar

  mypy:
    name: Run MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run MyPy
        run: mypy Juego/Consola Files/Scripts

  tests-summary:
    name: tests-summary
    runs-on: ubuntu-latest
    needs: [pre-commits, unit-tests, integration-tests, mypy]
    if: always()
    steps:
      - name: Aggregate test results
        run: |
          {
            echo "## Resumen CI"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|-----------|"
            echo "| Pre-Commits | ${{ needs.pre-commits.result }} |"
            echo "| Run Unit Tests | ${{ needs.unit-tests.result }} |"
            echo "| Run Integration Tests | ${{ needs.integration-tests.result }} |"
            echo "| Run MyPy | ${{ needs.mypy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.pre-commits.result }}" != "success" ]] \
            || [[ "${{ needs.unit-tests.result }}" != "success" ]] \
            || [[ "${{ needs.integration-tests.result }}" != "success" ]] \
            || [[ "${{ needs.mypy.result }}" != "success" ]]; then
            echo "Algún job de Tests ha fallado."
            exit 1
          fi
