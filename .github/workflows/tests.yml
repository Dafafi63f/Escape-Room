name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONPATH: ${{ github.workspace }}/Juego
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  pre-commits:
    name: Pre-Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Pre-Commits
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: "pip install --only-binary=:all: -r requirements.txt"

      - name: Install fonts for pygame emoji tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji fontconfig
          fc-cache -f

      - name: Tests juego
        run: python -m unittest discover -s Tests -t . -v

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: "pip install --only-binary=:all: -r requirements.txt"

      - name: Install fonts for pygame emoji tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji fontconfig
          fc-cache -f

      - name: Suite juego
        run: python -m unittest discover -s Tests -t . -v

      - name: Validar banco cerrado
        run: python Files/mantenimiento.py validar

      - name: Health check
        run: python Files/health_check.py --solo-datos

  mypy:
    name: Run MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: "pip install --only-binary=:all: -r requirements.txt"

      - name: Run MyPy (Comun + Files)
        run: mypy Juego/Comun Files

      - name: Run MyPy (Grafico)
        run: mypy Juego/Grafico --follow-imports=skip

  tests-summary:
    name: tests-summary
    runs-on: ubuntu-latest
    needs: [pre-commits, unit-tests, integration-tests, mypy]
    if: always()
    steps:
      - name: Aggregate test results
        run: |
          {
            echo "## Resumen CI"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|-----------|"
            echo "| Pre-Commits | ${{ needs.pre-commits.result }} |"
            echo "| Run Unit Tests | ${{ needs.unit-tests.result }} |"
            echo "| Run Integration Tests | ${{ needs.integration-tests.result }} |"
            echo "| Run MyPy | ${{ needs.mypy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.pre-commits.result }}" != "success" ]] \
            || [[ "${{ needs.unit-tests.result }}" != "success" ]] \
            || [[ "${{ needs.integration-tests.result }}" != "success" ]] \
            || [[ "${{ needs.mypy.result }}" != "success" ]]; then
            echo "Algún job de Tests ha fallado."
            exit 1
          fi
