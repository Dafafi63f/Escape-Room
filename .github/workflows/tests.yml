name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONPATH: Juego
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  pre-commits:
    name: Pre-Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Pre-Commits
        uses: pre-commit/action@v3.0.1

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests juego
        run: python -m unittest discover -s Tests -v

      - name: Tests Files
        run: python -m unittest discover -s Files -p "test_*.py" -v

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Suite juego
        run: python -m unittest discover -s Tests -v

      - name: Suite Files
        run: python -m unittest discover -s Files -p "test_*.py" -v

      - name: Validar banco cerrado
        run: python Files/mantenimiento.py validar

  mypy:
    name: Run MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MyPy
        run: mypy Juego/Comun Juego/Consola Juego/Grafico Files

  tests-summary:
    name: tests-summary
    runs-on: ubuntu-latest
    needs: [pre-commits, unit-tests, integration-tests, mypy]
    if: always()
    steps:
      - name: Aggregate test results
        run: |
          {
            echo "## Resumen CI"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|-----------|"
            echo "| Pre-Commits | ${{ needs.pre-commits.result }} |"
            echo "| Run Unit Tests | ${{ needs.unit-tests.result }} |"
            echo "| Run Integration Tests | ${{ needs.integration-tests.result }} |"
            echo "| Run MyPy | ${{ needs.mypy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.pre-commits.result }}" != "success" ]] \
            || [[ "${{ needs.unit-tests.result }}" != "success" ]] \
            || [[ "${{ needs.integration-tests.result }}" != "success" ]] \
            || [[ "${{ needs.mypy.result }}" != "success" ]]; then
            echo "Algún job de Tests ha fallado."
            exit 1
          fi
